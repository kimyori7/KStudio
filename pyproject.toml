[project]
name = "screen-recorder"
# 버전은 단일 소스 src/screen_recorder/__init__.py 의 __version__ 에서 유도(아래 dynamic).
# 정보창·인스톨러(.iss)도 모두 그 한 줄을 따른다 — 여기서 중복 선언하지 말 것.
dynamic = ["version"]
description = "Bandicam-like screen recorder"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "dxcam>=0.0.5",
    "PyAudioWPatch>=0.2.12.7",
    "pygetwindow>=0.0.9",
    "send2trash>=1.8",
    "rembg[cpu]>=2.0",
    "Pillow>=10",
    "pywin32>=306; sys_platform == 'win32'",
    "scenedetect>=0.6",
    "librosa>=0.10",
    # 인앱 Claude 에이전트(채팅/도구). 누락 시 앱이 시작 단계에서 ModuleNotFoundError
    # 로 죽는다 (ui/agent → agent/tools 가 import 단계에서 사용). 빌드 환경에 필수.
    "claude-agent-sdk>=0.2",
    # 유튜브 영상 추출 / mp3 변환 (추가 기능 메뉴). mp4 머지·mp3 추출은 동봉 ffmpeg 사용.
    # 주의: 유튜브 사이트 변경 시 가끔 업데이트가 필요하며, 설치본 동봉본은 재빌드로만 갱신됨.
    "yt-dlp>=2024.1",
    # OS 인증서 저장소로 TLS 검증 — 사내 프록시(TLS 인터셉트) 환경에서 yt-dlp 가
    # CERTIFICATE_VERIFY_FAILED 로 죽지 않게 한다 (run_download 에서 lazy inject).
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-cov>=5"]

[project.scripts]
screen-recorder = "screen_recorder.app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "screen_recorder.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
