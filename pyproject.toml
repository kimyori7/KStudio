[project]
name = "screen-recorder"
version = "0.1.0"
description = "Bandicam-like screen recorder"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "dxcam>=0.0.5",
    "PyAudioWPatch>=0.2.12.7",
    "pygetwindow>=0.0.9",
    "send2trash>=1.8",
    "rembg[cpu]>=2.0",
    "Pillow>=10",
    "pywin32>=306; sys_platform == 'win32'",
    "scenedetect>=0.6",
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-cov>=5"]

[project.scripts]
screen-recorder = "screen_recorder.app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
